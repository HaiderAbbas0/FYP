# System smoke test — full API + worker + evaluate.py integration

name: System Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  LLM_PROVIDER_CHAIN: ""

jobs:
  smoke:
    name: Runtime smoke (45 paired runs)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install --no-deps -e .

      - name: Run runtime smoke test
        working-directory: backend
        run: python tests/runtime_smoke.py

      - name: Upload evaluation-smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-smoke-report
          path: docs/haider/evaluation-smoke/
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          python -c "
          import json, pathlib, sys
          p = pathlib.Path('docs/haider/evaluation-smoke/report.json')
          if not p.exists():
              print('⚠️ report.json not found — smoke test may have failed before writing output.')
              sys.exit(0)
          r = json.loads(p.read_text())
          runs = r.get('runs', [])
          total = len(runs)
          complete = sum(1 for x in runs if x.get('complete'))
          outcomes = {}
          for x in runs:
              o = x.get('outcome', 'UNKNOWN')
              outcomes[o] = outcomes.get(o, 0) + 1
          lines = [
              '### System Smoke Test Results', '',
              '| Metric | Value |',
              '|--------|-------|',
              f'| Total runs | {total} |',
              f'| Complete | {complete} |',
          ]
          for o, c in sorted(outcomes.items()):
              lines.append(f'| Outcome: {o} | {c} |')
          latency = r.get('latency', {})
          if latency:
              p50 = latency.get('p50')
              p95 = latency.get('p95')
              if p50 is not None:
                  lines.append(f'| Latency p50 | {p50:.2f}s |')
              if p95 is not None:
                  lines.append(f'| Latency p95 | {p95:.2f}s |')
          with open('$GITHUB_STEP_SUMMARY', 'a') as f:
              f.write('\n'.join(lines) + '\n')
          " || echo "⚠️ Could not parse report.json for summary."
